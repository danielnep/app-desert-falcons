<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Desert Falcons - Sistema Completo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Simulador Dev (Controle de Testes) -->
    <div class="dev-switcher">
        <button id="btn-view-cmd" class="active" onclick="switchView('comando')">📡 COMANDO</button>
        <button id="btn-view-jog" onclick="switchView('jogador')">🔫 JOGADOR</button>
    </div>

    <!-- CAMADA 1: DASHBOARD DO COMANDO -->
    <div id="view-comando" class="view-layer active">
        <h2 class="section-title">DASHBOARD DA OPERAÇÃO</h2>
        
        <div class="cmd-grid">
            <div class="cmd-card">
                <h3>Status do Motor</h3>
                <p id="cmd-status">AGUARDANDO</p>
                <button class="btn-cmd" id="btn-iniciar" onclick="dispararEvento('MATCH_START')">Iniciar Partida</button>
                <button class="btn-cmd danger" style="display:none;" id="btn-encerrar" onclick="dispararEvento('MATCH_END')">Encerrar</button>
            </div>
            <div class="cmd-card">
                <h3>Operadores Vivos</h3>
                <p style="color: var(--blue-team);">Azul: <span id="cmd-vivos-azul">12</span></p>
                <p style="color: var(--danger);">Vermelho: <span id="cmd-vivos-verm">12</span></p>
            </div>
        </div>

        <h3 class="section-title" style="font-size: 0.9rem;">REGISTRO DE EVENTOS (MOTOR)</h3>
        <div class="log-box" id="cmd-logs"></div>
    </div>

    <!-- CAMADA 2: PAINEL TÁTICO DO JOGADOR -->
    <div id="view-jogador" class="view-layer">
        <div class="hud-header">
            <h1 id="ui-op-name">Operação Blackout</h1>
            <div class="hud-time" id="ui-time">00:00:00</div>
        </div>

        <div id="ui-status-box" class="status-display offline">
            <h2 id="ui-status-title">FORA DE COMBATE</h2>
            <p id="ui-status-desc">Aguarde o Comando iniciar a operação.</p>
        </div>

        <div id="ui-critical-action"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
